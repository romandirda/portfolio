<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <title>Cookie Clicker - Modern Edition</title>
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="game-container">
        <header>
            <h1>Cookie Clicker</h1>
            <h2>Upečeno sušenek: <span id="skore">0</span></h2>
        </header>

        <section class="cookie-section">
            <button id="btn-susenka">
                <span class="cookie-text">UPEČ!</span>
            </button>
        </section>

        <hr>

        <section class="shop-section">
            <h3>Obchod s upgrady</h3>
            <div class="shop-grid">
                <button id="btn-babicka" class="btn-upgrade">Najmout Babičku (Cena: 10 sušenek)</button>
                <button id="btn-tovarna" class="btn-upgrade">Koupit Továrnu (Cena: 50 sušenek)</button>
                <button id="btn-dul" class="btn-upgrade">Koupit Důl na čokoládu (Cena: 200 sušenek)</button>
            </div>
        </section>

        <hr>

        <section class="risk-section">
            <h3>Risk management</h3>
            <button id="btn-zlata"> Zlatá sušenka (Riziková investice) </button>
        </section>
    </div>

    <script src="script.js"></script>
</body>
</html>
